# ---------------------------------------------------------
# See "https://rust-lang.github.io/rustfmt" for details.
# ---------------------------------------------------------

# Rust style edition baseline.
style_edition = "2024"

# Use Unix line endings (`\n`) for consistent diffs.
newline_style = "Unix"

# Keep each derive on its own line for cleaner diffs.
merge_derives = false

# Use field initialize shorthand if possible.
use_field_init_shorthand = true

# ---------------------------------------------------------
# Waiting for stability

# Group imports at the module level.
# imports_granularity = "Module"
