name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Linux — native target: fmt + doc + check + clippy + test
  # ===========================================================================
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      # --- Format ---
      - run: cargo fmt --all --check

      # --- Doc ---
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # --- Check / Clippy / Test ---
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

      # --- Doc with single_thread feature --- 
      - run: cargo doc --workspace --no-deps --features "single_thread"
        env:
          RUSTDOCFLAGS: -D warnings

      # --- Check / Clippy / Test with single_thread feature ---
      - run: cargo check --workspace --features "single_thread"
      - run: cargo clippy --workspace --features "single_thread" -- -D warnings
      - run: cargo test --workspace --features "single_thread"

  # ===========================================================================
  # Windows — native target:  doc + check + clippy + test
  # ===========================================================================
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # --- Doc ---
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # --- Check / Clippy / Test ---
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  # ===========================================================================
  # MacOS — native target: doc + check + clippy + test
  # ===========================================================================
  macos:
    name: MacOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
        
      # --- Doc ---
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # --- Check / Clippy / Test ---
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  # ===========================================================================
  # WASM — cross-compile doc + check + clippy (no test — needs browser runtime)
  # ===========================================================================
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          target: wasm32-unknown-unknown

      # --- Doc ---
      - run: cargo doc --workspace --no-deps --target wasm32-unknown-unknown
        env:
          RUSTDOCFLAGS: -D warnings

      # --- Check ---
      - run: cargo check --workspace --target wasm32-unknown-unknown

      # --- Clippy ---
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
