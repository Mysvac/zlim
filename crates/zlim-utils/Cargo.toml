[package]
name = "zlim-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

# Serialize and Deserialize support
serde_core = { version = "1.0", default-features = false, features = ["std"] }

# Small Buffer Optimized Vector
fastvec = { version = "2.0", default-features = false, features = ["arrayvec", "fastvec", "smallvec", "serde"] }

# Small Buffer Optimized String
smol_str = { version = "0.3.6", default-features = false }

# Fixed Hasher
foldhash = { version = "0.2", default-features = false }

# Hash Container
hashbrown = { version = "0.17", default-features = false, features = ["equivalent", "serde"] }

# Async Channel
event-listener = { version = "5.4.2", default-features = false, features = ["std"] }

[dev-dependencies]
# Async Channel Tests
futures-lite = { version = "2.6", default-features = false, features = ["std"] }  

[lints]
workspace = true
