[package]
name = "zlim-internal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["README.zh.md"]

[features]

dylib = ["zlim-sysinfo/dylib"]

single_thread = ["zlim-task/single_thread"]

default_log_level = ["zlim-log/default_log_level"]

debug = [
    "zlim-log/debug",
    "zlim-utils/debug",
    "zlim-core/debug",
    "zlim-math/debug",
    "zlim-transform/debug",
    "zlim-asset/debug",
]

backtrace = [
    "zlim-core/backtrace",
    "zlim-app/backtrace",
]

trace = [
    "zlim-core/trace",
    "zlim-app/trace",
]

trace_error = ["zlim-log/trace_error", "trace"]

trace_tracy = ["zlim-log/trace_tracy", "trace"]

trace_chrome = ["zlim-log/trace_chrome", "trace"]

tracy_memory = ["zlim-log/tracy_memory"]

libm = ["zlim-math/libm"]

rand = ["zlim-math/rand"]

approx = ["zlim-math/approx"]

async-io = ["zlim-task/async-io"]

watch = ["zlim-asset/watch"]

http = ["zlim-asset/http"]
https = ["zlim-asset/https"]
web_asset_cache = ["zlim-asset/web_asset_cache"]

zlim-sample = ["dep:zlim-sample"]

zlim-sysinfo = ["dep:zlim-sysinfo"]

[dependencies]

zlim-cfg = { path = "../zlim-cfg", default-features = false }
zlim-ptr = { path = "../zlim-ptr", default-features = false }
zlim-reg = { path = "../zlim-reg", default-features = false }

zlim-os = { path = "../zlim-os", default-features = false }
zlim-utils = { path = "../zlim-utils", default-features = false }
zlim-log = { path = "../zlim-log", default-features = false }

zlim-path = { path = "../zlim-path", default-features = false }
zlim-task = { path = "../zlim-task", default-features = false }

zlim-core = { path = "../zlim-core", default-features = false }

zlim-app = { path = "../zlim-app", default-features = false }

zlim-math = { path = "../zlim-math", default-features = false }

zlim-shape = { path = "../zlim-shape", default-features = false }

zlim-curve = { path = "../zlim-curve", default-features = false }

zlim-color = { path = "../zlim-color", default-features = false }

zlim-transform = { path = "../zlim-transform", default-features = false }

zlim-diagnostic = { path = "../zlim-diagnostic", default-features = false }

zlim-asset = { path = "../zlim-asset", default-features = false }

zlim-sample = { path = "../zlim-sample", default-features = false, optional = true }

zlim-sysinfo = { path = "../zlim-sysinfo", default-features = false, optional = true }

[lints]
workspace = true
