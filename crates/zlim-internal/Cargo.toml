[package]
name = "zlim-internal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]

debug = [
    "zlim-log/debug",
    "zlim-utils/debug",
    "zlim-reflect/debug",
    "zlim-core/debug",
]

trace = [
    "zlim-log/trace",
    "zlim-core/trace",
    "zlim-app/trace",
]

trace_tracy = ["zlim-log/trace_tracy"]

trace_memory = ["zlim-log/trace_memory"]

trace_chrome = ["zlim-log/trace_chrome"]

default_log_level = ["zlim-log/default_log_level"]

dylib = []

editor = []

async_io = ["zlim-task/async_io"]

single_thread = ["zlim-task/single_thread"]

uuid = ["zlim-reflect/uuid"]

glam = ["zlim-reflect/glam"]

[dependencies]

zlim-cfg = { path = "../zlim-cfg", default-features = false }
zlim-ptr = { path = "../zlim-ptr", default-features = false }
zlim-reg = { path = "../zlim-reg", default-features = false }

zlim-os = { path = "../zlim-os", default-features = false }
zlim-utils = { path = "../zlim-utils", default-features = false }
zlim-log = { path = "../zlim-log", default-features = false }

zlim-task = { path = "../zlim-task", default-features = false }
zlim-reflect = { path = "../zlim-reflect", default-features = false }

zlim-core = { path = "../zlim-core", default-features = false }

zlim-app = { path = "../zlim-app", default-features = false }

[lints]
workspace = true
