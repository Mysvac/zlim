[package]
name = "zlim-shape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["README.zh.md"]

[dependencies]

zlim-reflect = { path = "../zlim-reflect", default-features = false }
zlim-math = { path = "../zlim-math", default-features = false }

serde = { version = "1.0", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
zlim-math = { path = "../zlim-math", default-features = false, features = ["approx"] }

approx = "0.5"
glam = { version = "0.34", default-features = false, features = ["approx-05"] }

[lints]
workspace = true
