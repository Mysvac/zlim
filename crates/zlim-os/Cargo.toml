[package]
name = "zlim-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[features]

[dependencies]

zlim-cfg = { path = "../zlim-cfg", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = { version = "0.3", default-features = false, features = ["std"] }
web-time = { version = "1.1", default-features = false, features = ["serde"] }
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { version = ">= 0.59.0", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Com",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }

[lints]
workspace = true
